# Déploiement automatique du tableau de bord sur GitHub Pages
name: Deploy static content to Pages

on:
  # Déclenchement automatique après chaque modification de la branche main
  push:
    branches:
      - main

  # Possibilité de lancer manuellement le déploiement
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
